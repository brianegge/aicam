[pytest]
# train/ holds training and evaluation scripts, not tests. test_dist.py is
# named like one, and reads both a dataset file and sys.argv at import time,
# so collecting it aborts the whole run -- CI failed on 2026-09-13 with
# FileNotFoundError: '-v/colorstats.json', pytest's own -v parsed as a path.
#
# This also keeps `pytest` with no arguments honest, which the CI test job
# relies on since it stopped naming test files individually.
norecursedirs = train .venv .tfvenv __pycache__ excludes watchdog .git

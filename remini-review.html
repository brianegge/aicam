<!DOCTYPE html>
<!--
  "Is this Chloe?" for a Remini preschool photo -- see remini_review.py.

  Lives beside review.html and face-review.html in Home Assistant's
  /config/www (served at /local/remini-review.html), linked from the Pushover
  that carries the photo with the face boxed. ?file=<candidate id>&name=<child>.
  A button calls the aicam_roboflow_review webhook with model=remini,
  file=<id>, cam=yes|no; the review server on claw-mini confirms with its own
  Pushover (the webhook answers with an empty body, see review.html).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Is this her?</title>
<style>
 :root { color-scheme: dark; }
 body{font-family:-apple-system,system-ui,sans-serif;max-width:520px;
      margin:0 auto;padding:24px 16px 40px;background:#111;color:#eee}
 h1{font-size:22px;font-weight:600;margin:0 0 6px}
 .sub{color:#999;font-size:14px;margin:0 0 22px;line-height:1.4}
 button{display:block;width:100%;padding:20px;margin:12px 0;font-size:19px;
        font-weight:600;border:0;border-radius:12px;color:#fff;
        -webkit-tap-highlight-color:transparent}
 .yes{background:#16a34a} .no{background:#4b5563}
 button:disabled{opacity:.4}
 #out{margin-top:20px;padding:14px;border-radius:10px;background:#1c1c1e;
      font-size:15px;color:#ddd;display:none}
</style>
</head>
<body>
<h1 id="q">Is this her?</h1>
<p class="sub">The face is boxed in yellow on the photo in the notification.
"Yes" adds the photo to the next batch sent over iMessage, and teaches Frigate
her face.</p>
<button class="yes" data-a="yes" id="yes">Yes</button>
<button class="no" data-a="no">No, someone else</button>
<div id="out"></div>
<script>
 var q = new URLSearchParams(location.search);
 var file = q.get("file") || "", name = q.get("name") || "her";
 document.getElementById("q").textContent = "Is this " + name + "?";
 document.getElementById("yes").textContent = "Yes, it's " + name;
 var out = document.getElementById("out");
 function say(t) { out.textContent = t; out.style.display = "block"; }
 function all(d) { var b = document.querySelectorAll("button"); for (var i = 0; i < b.length; i++) b[i].disabled = d; }
 function answer(a) {
   if (!file) { say("No photo in the link."); return; }
   all(true); say("Sending…");
   fetch(location.origin + "/api/webhook/aicam_roboflow_review?model=remini&file="
         + encodeURIComponent(file) + "&cam=" + a)
     .then(function (r) {
       say(r.ok ? "Sent. The confirmation will arrive as a notification."
                : "Home Assistant answered " + r.status + ".");
       if (!r.ok) all(false);
     })
     .catch(function (e) { say("Could not reach Home Assistant: " + e); all(false); });
 }
 document.addEventListener("click", function (e) { if (e.target.dataset && e.target.dataset.a) answer(e.target.dataset.a); });
</script>
</body>
</html>
